name: campusly
description: Your Campus, Your Community. A Mundiapolis Flutter widgets project.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/portraits/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
